name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so that a change on the Copilot CLI side shows up even when nothing here changes.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the tag in a comment; .github/dependabot.yml keeps them
# current. A tag can be moved to other code, a commit cannot.

jobs:
  assets:
    name: Validate and check generated output
    runs-on: ubuntu-latest
    # 事故ったとき 6 時間回り続けて無料枠を溶かさないための上限
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Shared-asset contract: required frontmatter, name/location agreement,
      # agentskills.io limits (name <= 64, description <= 1024), manifest consistency.
      - name: Validate shared assets and manifests
        run: npm run validate

      # The per-harness output is committed so users can install it without a build
      # step. This fails if it no longer matches shared/**.
      - name: Check generated output is up to date
        run: npm run build:check

  test:
    # The m365 extension runs on Windows, under the Node.js that Copilot CLI bundles (24 at
    # the time of writing). 22 is the oldest Node.js still supported, and the oldest this
    # repo accepts (package.json engines). Windows is also where the UI Automation driver
    # tests run; they are skipped elsewhere.
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Test extension code
        run: npm test

  copilot-cli:
    # Installs the marketplace into the real Copilot CLI (latest release) and runs the m365
    # commands in its interactive screen, without signing in. It downloads the CLI (about
    # 200 MB), so it runs on main, weekly and by hand, not on every pull request.
    name: Copilot CLI smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install tmux and Copilot CLI
        run: |
          command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
          npm install -g @github/copilot@latest

      - name: Install the plugin and run its commands
        run: tests/copilot-cli-smoke.sh

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    # 事故ったとき 6 時間回り続けて無料枠を溶かさないための上限
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !node_modules
            !dist
            !plugins/*/skills
            !plugins/*/commands
            !plugins/*/agents
            !copilot-plugins/*/skills
            !copilot-plugins/*/agents
